name: Build UIAReadProbe

on:
  workflow_dispatch:

  push:
    branches:
      - feature/mx-voice-ptt-v1.4-20260906
    paths:
      - "UIAReadProbe/**"
      - ".github/workflows/build-uiareadprobe.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate UI Automation assemblies
        shell: pwsh
        run: |
          $uiaClient = Get-ChildItem "$env:WINDIR\Microsoft.NET\assembly\GAC_MSIL\UIAutomationClient" -Recurse -Filter "UIAutomationClient.dll" | Select-Object -First 1 -ExpandProperty FullName
          $uiaTypes = Get-ChildItem "$env:WINDIR\Microsoft.NET\assembly\GAC_MSIL\UIAutomationTypes" -Recurse -Filter "UIAutomationTypes.dll" | Select-Object -First 1 -ExpandProperty FullName
          $windowsBase = Get-ChildItem "$env:WINDIR\Microsoft.NET\assembly\GAC_MSIL\WindowsBase" -Recurse -Filter "WindowsBase.dll" | Select-Object -First 1 -ExpandProperty FullName

          if (-not $uiaClient) {
            throw "UIAutomationClient.dll not found"
          }

          if (-not $uiaTypes) {
            throw "UIAutomationTypes.dll not found"
          }

          if (-not $windowsBase) {
            throw "WindowsBase.dll not found"
          }

          "UIA_CLIENT=$uiaClient" | Out-File -FilePath $env:GITHUB_ENV -Append
          "UIA_TYPES=$uiaTypes" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_BASE=$windowsBase" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile UIA probe
        shell: cmd
        run: |
          if not exist "UIAReadProbe\dist" mkdir "UIAReadProbe\dist"

          set "CSC=%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe"

          if not exist "%CSC%" set "CSC=%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe"

          "%CSC%" ^
            /nologo ^
            /target:winexe ^
            /optimize+ ^
            /platform:anycpu ^
            /r:System.dll ^
            /r:System.Core.dll ^
            /r:System.Windows.Forms.dll ^
            /r:"%WINDOWS_BASE%" ^
            /r:"%UIA_CLIENT%" ^
            /r:"%UIA_TYPES%" ^
            /out:"UIAReadProbe\dist\UIAReadProbe.exe" ^
            "UIAReadProbe\Program.cs"

      - name: Package
        shell: pwsh
        run: |
          $package = "UIAReadProbe/dist/UIAReadProbe_Windows_v0.2"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "UIAReadProbe/dist/UIAReadProbe.exe" $package
          Copy-Item "UIAReadProbe/Program.cs" $package
          Compress-Archive -Path "$package/*" -DestinationPath "UIAReadProbe/dist/UIAReadProbe_Windows_v0.2.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: UIAReadProbe_Windows_v0.2
          path: UIAReadProbe/dist/UIAReadProbe_Windows_v0.2.zip
          if-no-files-found: error
