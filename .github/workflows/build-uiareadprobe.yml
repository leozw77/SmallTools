name: Build UIAReadProbe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mx-voice-ptt-v1.4-20260906
    paths:
      - 'UIAReadProbe/**'
      - '.github/workflows/build-uiareadprobe.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile UIA probe
        shell: cmd
        run: |
          if not exist "UIAReadProbe\dist" mkdir "UIAReadProbe\dist"
          set "CSC=%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if not exist "%CSC%" set "CSC=%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          "%CSC%" /nologo /target:winexe /optimize+ /platform:anycpu /r:System.dll /r:System.Core.dll /r:System.Windows.Forms.dll /r:WindowsBase.dll /r:UIAutomationClient.dll /r:UIAutomationTypes.dll /out:"UIAReadProbe\dist\UIAReadProbe.exe" "UIAReadProbe\Program.cs"

      - name: Package
        shell: pwsh
        run: |
          $package = "UIAReadProbe/dist/UIAReadProbe_Windows_v0.1"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "UIAReadProbe/dist/UIAReadProbe.exe" $package
          Copy-Item "UIAReadProbe/Program.cs" $package
          Compress-Archive -Path "$package/*" -DestinationPath "UIAReadProbe/dist/UIAReadProbe_Windows_v0.1.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: UIAReadProbe_Windows_v0.1
          path: UIAReadProbe/dist/UIAReadProbe_Windows_v0.1.zip
          if-no-files-found: error
