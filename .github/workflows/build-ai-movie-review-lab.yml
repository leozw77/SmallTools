name: Build AI Movie Review Lab

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "AiMovieReviewLab/**"
      - ".github/workflows/build-ai-movie-review-lab.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "AiMovieReviewLab/**"
      - ".github/workflows/build-ai-movie-review-lab.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        shell: pwsh
        run: dotnet restore .\AiMovieReviewLab\AiMovieReviewLab.csproj

      - name: Build Release
        shell: pwsh
        run: dotnet build .\AiMovieReviewLab\AiMovieReviewLab.csproj -c Release --no-restore

      - name: Publish compact .NET 8 win-x64
        shell: pwsh
        run: >-
          dotnet publish .\AiMovieReviewLab\AiMovieReviewLab.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\dist\AiMovieReviewLab

      - name: Smoke-test app startup
        shell: pwsh
        run: |
          $crashLog = Join-Path $env:LOCALAPPDATA "AiMovieReviewLab\startup-crash.log"
          Remove-Item $crashLog -Force -ErrorAction SilentlyContinue
          $exe = Get-ChildItem .\dist\AiMovieReviewLab\*.exe | Select-Object -First 1
          if (-not $exe) { throw "Published EXE was not found." }
          $process = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 4
          if (Test-Path $crashLog) {
            $detail = Get-Content $crashLog -Raw
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Startup crash log was created:`n$detail"
          }
          if ($process.HasExited) {
            throw "Application exited during startup smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\AiMovieReviewLab\* -DestinationPath .\dist\AiMovieReviewLab-v0.1-preview.6-net8-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiMovieReviewLab-v0.1-preview.6-net8-win-x64
          path: .\dist\AiMovieReviewLab-v0.1-preview.6-net8-win-x64.zip
          if-no-files-found: error
